        <span>Dashboard</span>

      <a href="/pages/bounty-board.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
        <span>Bounty board</span>
      </a>
      <a href="/pages/submit-patch.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        <span>My submissions</span>
      </a>
      <a href="/pages/dispute.html" class="sidebar-link">

        <span>Disputes</span>

      <a href="/pages/profile.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        <span>Profile</span>
      </a>
    </nav>
    <a href="#" class="sidebar-link sidebar-logout" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

  </aside>

  <div>
    <header class="topbar">
      <h1>My submissions</h1>
      <span id="walletChipContainer"></span>
    </header>

    <main class="content-area">
      <div class="dashboard-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>Submission history</h2>
          </div>
          <table class="data-table" id="submissionTable">
            <thead>
              <tr>
                <th>Case</th>
                <th>Branch</th>
                <th>Result</th>
                <th>Submitted</th>
              </tr>
            </thead>
            <tbody id="submissionTableBody"></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Submit a patch</h2>
          </div>
          <form id="submitForm" novalidate>
            <div class="form-group">
              <label for="bountySelect">Claimed bounty</label>
              <select id="bountySelect" required></select>
            </div>
            <div class="form-group">
              <label for="branchLink">Branch or commit link</label>
              <input type="text" id="branchLink" placeholder="https://github.com/owner/repo/pull/12" required>
            </div>
            <div class="form-group">
              <label for="explanation">Explanation</label>
              <textarea id="explanation" rows="4" placeholder="What did the patch change, and why does it fix the issue?" required></textarea>
            </div>
            <button type="submit" class="auth-submit" id="submitPatchBtn">Submit patch</button>
          </form>
        </div>
      </div>
    </main>
  </div>

</div>

<script type="module" src="/js/pages/submit-patch.js"></script>
</body>
</html>
