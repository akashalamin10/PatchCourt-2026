<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — PatchCourt</title>
<link rel="icon" href="/assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/animations.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="auth-back-home">&larr; Back to home</a>
    <a href="/" class="auth-brand">
      <img src="/assets/images/genlayer-logo.jpg" alt="GenLayer">
      <span>PatchCourt</span>
    </a>
    <h1>Create your account</h1>
    <p>Tell us which side of the bounty you're on.</p>

    <form id="signupForm" novalidate>
      <div class="role-toggle">
        <div class="role-option">
          <input type="radio" name="role" id="roleBuyer" value="buyer" checked>
          <label for="roleBuyer">I post bounties</label>
        </div>
        <div class="role-option">
          <input type="radio" name="role" id="roleWorker" value="worker">
          <label for="roleWorker">I fix bugs</label>
        </div>
      </div>

      <button type="button" class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/></svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider"><span>or</span></div>

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
        <div class="field-error" id="nameError"></div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <div class="field-error" id="emailError"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <div class="field-error" id="passwordError"></div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <div class="field-error" id="confirmPasswordError"></div>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/pages/login.html">Log in</a></p>
  </div>
</div>

<script type="module" src="/js/pages/signup.js"></script>
</body>
</html>
