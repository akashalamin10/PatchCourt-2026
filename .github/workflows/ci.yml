name: PatchCourt CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r contracts/requirements.txt
      - run: python3 -m pytest contracts/tests/ -q
  check-frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in $(find public/js -name "*.js"); do node --check "$f"; done
